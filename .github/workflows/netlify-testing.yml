name: Netlify testing branch checks

on:
  push:
    branches: [netlify-testing]
  pull_request:
    branches: [netlify-testing]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run verify

      - name: Smoke test isolated Agent API
        shell: bash
        run: |
          health="$(curl --fail --silent --show-error --max-time 20 https://somerion-netlify-test-agent-api.somerion-oi.workers.dev/health)"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true || x.environment!=="isolated-test" || x.firebaseProject!=="somerion-oi-testing") process.exit(1);' "$health"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://somerion-netlify-test-agent-api.somerion-oi.workers.dev/v1/autonomy/settings)"
          test "$status" = "401"
          headers="$(curl --silent --show-error --dump-header - --output /dev/null --max-time 20 --request OPTIONS https://somerion-netlify-test-agent-api.somerion-oi.workers.dev/v1/autonomy/actions --header 'Origin: https://somerion-operations-intelligence.netlify.app' --header 'Access-Control-Request-Method: POST' --header 'Access-Control-Request-Headers: authorization,content-type,idempotency-key')"
          printf '%s\n' "$headers" | grep -Eiq '^access-control-allow-headers:.*idempotency-key'

      - name: Smoke test isolated Netlify dashboard deployment
        if: github.event_name == 'push'
        shell: bash
        run: |
          page=""
          for attempt in $(seq 1 18); do
            if page="$(curl --fail --silent --show-error --max-time 20 https://somerion-operations-intelligence.netlify.app/)" && printf '%s' "$page" | grep -q 'agentAutonomyForm'; then
              break
            fi
            sleep 10
          done
          printf '%s' "$page" | grep -q 'Autonomous agent controls'
          printf '%s' "$page" | grep -q 'agentAutonomyForm'
