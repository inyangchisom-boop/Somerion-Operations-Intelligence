name: Autonomy Policy Tests

on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/autonomy-policy-tests.yml"
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - ".github/workflows/autonomy-policy-tests.yml"

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/agent-policy.js
          node --check functions/test/agent-policy.test.js
      - name: Run policy unit tests
        working-directory: functions
        run: npm test
