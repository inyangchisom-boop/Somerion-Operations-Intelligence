name: Firestore Rules Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/universal-business-profile]

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Test Firestore rules in the emulator
        run: npx firebase-tools emulators:exec --only firestore --project demo-somerion-oi "npm test"
